[project]
name = "deep-hedging-btc"
version = "0.1.0"
description = "Which simulated training market gives deep-hedging policies that hold up on real BTC options?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.13",
    "arch>=7.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
